# Domain Grabber — nouveaux domaines + scan vuln (sources gratuites)

output:
  directory: ./output
  format: jsonl
  deduplicate: true

# Ne garder que les domaines jamais vus (nouveaux)
new_domains:
  enabled: true
  database: ./data/domains.db
  max_age_hours: 24        # considéré "nouveau" si cert CT < 24h ou first_seen récent

sources:
  certstream:
    enabled: true
    url: wss://certstream.calidog.io/domains-only

  crtsh:
    enabled: true
    query: "%.com"
    poll_interval: 120
    max_age_hours: 24

  ct_logs:
    enabled: true
    tail: true
    logs:
      - https://ct.googleapis.com/logs/us1/argon2025h2
      - https://ct.googleapis.com/logs/us1/xenon2025h2
    batch_size: 512
    workers: 8

  commoncrawl:
    enabled: false
    tlds: [com, net, org, io]
    workers: 4
    max_per_tld: 0

  zone_files:
    enabled: false
    directory: ./zone_files

  rapid7_fdns:
    enabled: false
    directory: ./rapid7_data

scanner:
  enabled: true
  concurrency: 50
  timeout: 10
  # Détection safe par défaut (pas d'exploit RCE/XXE actif)
  aggressive: false
  callback_url: ""         # URL OOB optionnelle pour SSRF/XXE blind

  checks:
    lfi: true
    private_paths: true
    git_dump: true
    react2shell: true
    xxe: true
    ssrf: true
    ggb: true              # GraphQL introspection / endpoints exposés
    secrets: true          # .env, paths sensibles, secrets dans JS

  paths:
    - /.env
    - /.env.local
    - /.env.production
    - /.git/HEAD
    - /.git/config
    - /config.json
    - /wp-config.php.bak
    - /backup.sql
    - /admin
    - /debug
    - /actuator
    - /server-status
    - /graphql
    - /api/graphql
    - /v1/graphql

  lfi_params:
    - file
    - page
    - path
    - template
    - include
    - doc
    - folder
    - root
    - pg

  secret_patterns:
    - 'AKIA[0-9A-Z]{16}'
    - 'sk_live_[0-9a-zA-Z]{24,}'
    - 'ghp_[0-9a-zA-Z]{36}'
    - 'xox[baprs]-[0-9a-zA-Z-]{10,}'

filters:
  punycode: false
  ip_in_san: false
  suspicious_tlds: []
  require_match: false
  min_domain_length: 4
  max_domain_length: 253
