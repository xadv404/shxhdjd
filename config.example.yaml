# Domain Grabber — multi CT logs, cible 10-15k domain/s

output:
  directory: ./output
  file: domains.txt
  format: txt
  deduplicate: true

new_domains:
  enabled: false
  database: ./data/domains.db

performance:
  log_interval: 1
  format: txt
  batch_write: 5000
  flush_interval: 0.15
  db_commit_interval: 8
  inflight_per_log: 48
  parse_workers: 32
  start_offset: 600000
  max_logs: 6

sources:
  ct_logs:
    enabled: true
    max_logs: 6
    # logs Google par défaut (+ extras auto si discover)
    logs:
      - https://ct.googleapis.com/logs/us1/argon2026h2
      - https://ct.googleapis.com/logs/us1/argon2025h2
      - https://ct.googleapis.com/logs/eu1/xenon2026h2
      - https://ct.googleapis.com/logs/eu1/xenon2025h2
    batch_size: 32
    inflight_per_log: 48
    parse_workers: 32
    start_offset: 600000

filters:
  zero_spam: true
  punycode: false
  ip_in_san: false
  suspicious_tlds: []
  require_match: false
  min_domain_length: 4
  max_domain_length: 253

scanner:
  enabled: false
  concurrency: 50
  timeout: 10
  aggressive: false
  callback_url: ""
  checks:
    lfi: true
    private_paths: true
    git_dump: true
    react2shell: true
    xxe: true
    ssrf: true
    ggb: true
    secrets: true
  paths:
    - /.env
    - /.git/HEAD
  lfi_params: [file, page, path]
  secret_patterns:
    - 'AKIA[0-9A-Z]{16}'
