# Domain Grabber — CT → export (sans check HTTP)

output:
  directory: ./output
  format: txt
  deduplicate: true

new_domains:
  enabled: true
  database: ./data/domains.db
  max_age_hours: 24

performance:
  log_interval: 3
  format: txt
  batch_write: 2000
  flush_interval: 0.25
  db_commit_interval: 4
  inflight_per_log: 24
  parse_workers: 32
  tail: false
  start_offset: 500000

panel:
  host: 0.0.0.0
  port: 8080

sources:
  ct_logs:
    enabled: true
    discover: true
    tail: false
    start_offset: 500000
    batch_size: 32
    inflight_per_log: 24
    parse_workers: 32

scanner:
  enabled: false
  concurrency: 50
  timeout: 10
  aggressive: false
  callback_url: ""
  checks:
    lfi: true
    private_paths: true
    git_dump: true
    react2shell: true
    xxe: true
    ssrf: true
    ggb: true
    secrets: true
  paths:
    - /.env
    - /.git/HEAD
    - /graphql
    - /api/graphql
  lfi_params: [file, page, path, template, include]
  secret_patterns:
    - 'AKIA[0-9A-Z]{16}'
    - 'sk_live_[0-9a-zA-Z]{24,}'
    - 'ghp_[0-9a-zA-Z]{36}'

filters:
  zero_spam: true           # anti-spam CT (parking, free DNS, random, cloud noise)
  # zero_spam:               # config détaillée optionnelle
  #   enabled: true
  #   block_free_dns: true
  #   block_parking_tlds: true
  #   block_cloud_noise: true
  #   block_high_entropy: true
  #   max_labels: 5
  #   max_label_len: 32
  #   allow_suffixes: []      # ex: [xyz] pour autoriser .xyz
  #   extra_block_suffixes: []
  punycode: false
  ip_in_san: false
  suspicious_tlds: []
  require_match: false
  min_domain_length: 4
  max_domain_length: 253
