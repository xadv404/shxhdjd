# Domain Grabber — mode unique : CT + vérif HTTP + export

output:
  directory: ./output
  format: txt
  deduplicate: true

new_domains:
  enabled: true
  database: ./data/domains.db
  max_age_hours: 24

performance:
  log_interval: 3
  format: txt
  db_commit_interval: 4
  inflight_per_log: 24
  parse_workers: 32
  tail: false
  start_offset: 500000

panel:
  host: 0.0.0.0
  port: 8080

verify:
  require_http: true
  batch_size: 2000
  timeout: 2
  http_concurrency: 400
  tcp_concurrency: 1000
  dns_workers: 500
  masscan_rate: 100000
  prefer_tools: true
  resolvers_file: ""
  ports: [443, 80]
  http_status_max: 499

sources:
  ct_logs:
    enabled: true
    discover: true
    tail: false
    start_offset: 500000
    batch_size: 32
    inflight_per_log: 24
    parse_workers: 32

scanner:
  enabled: false
  concurrency: 50
  timeout: 10
  aggressive: false
  callback_url: ""
  checks:
    lfi: true
    private_paths: true
    git_dump: true
    react2shell: true
    xxe: true
    ssrf: true
    ggb: true
    secrets: true
  paths:
    - /.env
    - /.git/HEAD
    - /graphql
    - /api/graphql
  lfi_params: [file, page, path, template, include]
  secret_patterns:
    - 'AKIA[0-9A-Z]{16}'
    - 'sk_live_[0-9a-zA-Z]{24,}'
    - 'ghp_[0-9a-zA-Z]{36}'

filters:
  punycode: false
  ip_in_san: false
  suspicious_tlds: []
  require_match: false
  min_domain_length: 4
  max_domain_length: 253
