# Config max — 6 cores / 6 Go RAM / 1.7 Gbps
output:
  directory: ./output
  file: alive.txt

performance:
  log_interval_ms: 1000
  inflight_per_log: 64
  parse_workers: 6
  start_offset: 800000
  max_logs: 4
  batch_write: 5000
  check_workers: 4000
  check_timeout_ms: 600

sources:
  logs:
    - https://ct.googleapis.com/logs/us1/argon2026h2
    - https://ct.googleapis.com/logs/us1/argon2025h2
    - https://ct.googleapis.com/logs/eu1/xenon2026h2
    - https://ct.googleapis.com/logs/eu1/xenon2025h2

filters:
  zero_spam: true

throttle:
  enabled: true
  cpu_percent: 80
  ram_percent: 80
  check_interval_ms: 500
  sleep_ms: 50
