# Config max — 6 cores / 6 Go RAM / 1.7 Gbps
# Input: ton fichier .txt (1 domaine / ligne) via -i
output:
  directory: ./output
  file: alive.txt

performance:
  log_interval_ms: 1000
  check_workers: 4000
  check_timeout_ms: 600

throttle:
  enabled: true
  cpu_percent: 80
  ram_percent: 80
  check_interval_ms: 500
  sleep_ms: 50
